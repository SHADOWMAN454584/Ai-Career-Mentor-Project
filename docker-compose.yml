services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_mentor
      POSTGRES_USER: career_mentor
      POSTGRES_PASSWORD: career_mentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career_mentor:career_mentor@db:5432/career_mentor
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
